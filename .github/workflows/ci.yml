name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Migração gerada está em dia com o schema
        working-directory: apps/api
        run: |
          npx drizzle-kit generate
          git diff --exit-code -- drizzle || (echo "Rode 'npm run db:generate -w apps/api' e commite a migração" && exit 1)

  docker:
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t gigi-api .
